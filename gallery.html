<title>Gallery | GoozDelish</title><style>
:root{--pink:#c96682;--rose:#a74d67;--dark:#563b35;--cream:#fffaf6;--soft:#f8e7ec;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--dark);line-height:1.55}
img{width:100%;display:block}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,92%);margin:auto}
nav{position:sticky;top:0;z-index:20;background:rgba(255,250,246,.96);border-bottom:1px solid #ead9d3;backdrop-filter:blur(10px)}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1.8rem;color:var(--pink)}
.links{display:flex;gap:18px;align-items:center;font-weight:700;font-size:.93rem}
.btn{display:inline-block;background:var(--pink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700}
.btn:hover{background:var(--rose)}
.hero{padding:70px 0;background:radial-gradient(circle at 12% 10%,#f7dce4,transparent 30%),var(--cream)}
.hero-grid{display:grid;grid-template-columns:1fr .92fr;gap:44px;align-items:center}
.tag{display:inline-block;background:var(--soft);padding:7px 12px;border-radius:99px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
h1{font-family:Georgia,serif;font-size:clamp(2.7rem,6vw,5.2rem);line-height:1;margin:16px 0;color:#49322d}
h1 span{color:var(--pink)}.hero p{font-size:1.08rem;color:#755d56;max-width:610px}
.hero-photo{border-radius:28px;overflow:hidden;box-shadow:0 18px 45px rgba(86,59,53,.16)}
.hero-photo img{aspect-ratio:4/5;object-fit:cover}
section{padding:72px 0}.head{text-align:center;max-width:720px;margin:0 auto 34px}
h2{font-family:Georgia,serif;font-size:clamp(2rem,4vw,3rem);margin:0 0 10px}.head p{margin:0;color:#765d55}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 28px rgba(86,59,53,.08)}
.card b{display:block;font-size:1.1rem;margin:8px 0}.card span{font-size:2rem}.card p{font-size:.94rem;color:#775e57;margin:0}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.preview-grid a{border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(86,59,53,.09)}
.preview-grid img{aspect-ratio:1/1;object-fit:cover;transition:.25s transform}
.preview-grid a:hover img{transform:scale(1.025)}
.banner{background:#573c36;color:#fff;border-radius:30px;padding:42px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.banner p{color:#eee2dc}.banner .btn{background:#fff;color:var(--pink)}
footer{text-align:center;padding:34px 0;color:#866a61;border-top:1px solid #ead9d3}
@media(max-width:850px){.hero-grid,.banner{grid-template-columns:1fr}.services{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.links a:not(.btn){display:none}.services,.preview-grid{grid-template-columns:1fr 1fr}.hero{padding:48px 0}.banner{padding:28px 22px}}

.gallery-wrap{padding:54px 0 80px}
.gallery-grid{columns:4 240px;column-gap:14px}
.gallery-item{break-inside:avoid;margin:0 0 14px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 7px 20px rgba(86,59,53,.08)}
.gallery-item img{height:auto}
.gallery-top{text-align:center;max-width:740px;margin:0 auto 34px}
.gallery-top h1{font-size:clamp(2.5rem,5vw,4.5rem);margin-bottom:12px}
.gallery-top p{color:#765d55}
@media(max-width:650px){.gallery-grid{columns:2 150px;column-gap:10px}.gallery-item{margin-bottom:10px}}
</style>
